spring.application.name=learning
spring.profiles.active=production

spring.datasource.url=jdbc:mysql://localhost:3306/thesis?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=20150601
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# App Properties
thesis.app.jwt-secret=SontdThesisSuperSecretKeyForJwtTokenGeneration1234567890
thesis.app.jwt-expiration-ms=86400000

# OAuth client ID from Google Cloud Console, used to verify the "aud" claim of Google ID tokens
thesis.app.google-client-id=400239326113-5irehn2qafd3m1tsas4ufikhgsnsjgpd.apps.googleusercontent.com

# Directory uploaded card images are stored in. Relative path -> resolved against the
# directory containing the running jar, i.e. {jar dir}/imgs in production.
thesis.app.image.base-dir=imgs

# Multipart upload limits (defaults are only 1MB/10MB, too small for image uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB